<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실바 - 지식 나무</title>
    
    <!-- 주소창 및 브라우저 틀 완전히 없애는 PWA 설정 (단일 파일 방식) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111111">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22%EC%A7%80%EC%8B%9C%EB%82%98%EB%AC%B4%22,%22short_name%22:%22%EC%A7%80%EC%8B%9C%EB%82%98%EB%AC%B4%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#0d0d0d%22,%22theme_color%22:%22#111111%22}">

    <!-- Markmap & D3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #171717;
            --card-bg: #222222;
            --border-color: #2e2e2e;
            --text-primary: #ededed;
            --text-secondary: #888888;
            --btn-light: #e5e3dc;
            --btn-light-hover: #d0cecd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; background-color: var(--bg-color); color: var(--text-primary); overflow: hidden; -webkit-tap-highlight-color: transparent; }

        .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }

        /* 상단 헤더 */
        .header { height: 50px; background-color: #111111; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 30; padding-top: env(safe-area-inset-top); }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-title { font-size: 1rem; font-weight: 500; color: #fff; display: flex; align-items: center; gap: 6px; }
        .header-btns { display: flex; gap: 12px; align-items: center; }
        .icon-btn { background: transparent; border: none; color: #aaa; font-size: 1.1rem; cursor: pointer; padding: 4px; }
        .icon-btn:hover { color: #fff; }

        /* 메인 레이아웃 */
        .main-body { flex: 1; display: flex; position: relative; overflow: hidden; }

        /* 왼쪽 사이드바 */
        .sidebar { width: 320px; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: absolute; top: 0; bottom: 0; left: 0; z-index: 20; transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); padding: 16px; }
        .sidebar.open { transform: translateX(0); }

        .search-box { background: #0f0f0f; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: #fff; font-size: 0.9rem; outline: none; width: 100%; }

        /* 트리 목차 */
        .tree-container { flex: 1; overflow-y: auto; margin-bottom: 12px; }
        .tree-item { padding: 8px 0; font-size: 0.92rem; color: #ccc; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .tree-item:hover { color: #fff; }
        .tree-indent-1 { padding-left: 12px; }
        .tree-indent-2 { padding-left: 24px; color: #888; }

        /* 버튼 */
        .btn-add-root { background: var(--btn-light); color: #111; border: none; border-radius: 12px; padding: 14px; font-weight: 600; font-size: 0.95rem; width: 100%; cursor: pointer; transition: background 0.2s; }
        .btn-add-root:hover { background: var(--btn-light-hover); }
        .note-count-text { text-align: center; font-size: 0.75rem; color: var(--text-secondary); margin-top: 8px; }

        /* 마인드맵 영역 */
        .map-view { flex: 1; height: 100%; background-color: var(--bg-color); background-image: radial-gradient(#222 1px, transparent 1px); background-size: 24px 24px; position: relative; }
        .map-header { position: absolute; top: 20px; left: 24px; z-index: 5; }
        .map-header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
        .map-header p { font-size: 0.85rem; color: var(--text-secondary); }

        /* 줌 컨트롤러 */
        .zoom-controls { position: absolute; top: 20px; right: 20px; background: #1c1c1c; border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; padding: 4px 8px; gap: 12px; z-index: 5; }
        .zoom-controls button { background: none; border: none; color: #aaa; font-size: 1rem; cursor: pointer; }

        svg { width: 100%; height: 100%; }

        /* 상세 페이지 */
        .detail-view { position: absolute; top: 0; right: 0; bottom: 0; width: 100%; max-width: 420px; background: var(--panel-bg); border-left: 1px solid var(--border-color); padding: 24px 20px; display: flex; flex-direction: column; z-index: 25; transform: translateX(100%); transition: transform 0.25s ease; overflow-y: auto; }
        .detail-view.open { transform: translateX(0); }
        .detail-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .detail-title { font-size: 1.8rem; font-weight: 700; color: #fff; }
        .detail-date { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 20px; }
        .detail-body { font-size: 0.95rem; line-height: 1.6; color: #ddd; margin-bottom: 30px; }

        .sub-section-title { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; display: flex; justify-content: space-between; }
        .card-list { display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; cursor: pointer; transition: border-color 0.2s; }
        .card:hover { border-color: #555; }
        .card-title { font-size: 1.05rem; font-weight: 600; color: #fff; margin-bottom: 6px; }
        .card-desc { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* 에디터 오버레이 */
        .editor-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 40; padding: 20px; }
        .editor-modal.open { display: flex; }
        .editor-box { width: 100%; max-width: 500px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; height: 70vh; }
        .editor-box textarea { flex: 1; background: #0f0f0f; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: #fff; font-family: monospace; resize: none; outline: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 상단 헤더 -->
        <header class="header">
            <div class="header-left">
                <button class="icon-btn" onclick="toggleSidebar()">☰</button>
                <div class="header-title">🌲 실바</div>
            </div>
            <div class="header-btns">
                <button class="icon-btn" onclick="toggleEditor()">📝</button>
                <button class="icon-btn" onclick="toggleSidebar()">🔍</button>
                <button class="icon-btn" onclick="addNewRoot()">+</button>
            </div>
        </header>

        <div class="main-body">
            <!-- 왼쪽 목차 사이드바 -->
            <div class="sidebar" id="sidebar">
                <input type="text" class="search-box" placeholder="나무에서 찾기" onkeyup="filterTree(this.value)">
                <div class="tree-container" id="tree-container"></div>
                <button class="btn-add-root" onclick="addNewRoot()">+ 새 뿌리 노트</button>
                <div class="note-count-text" id="total-note-count">26개의 노트</div>
            </div>

            <!-- 마인드맵 영역 -->
            <div class="map-view">
                <div class="map-header">
                    <h1>지식 나무</h1>
                    <p>26개의 노트 · 상하관계가 곧 지도입니다</p>
                </div>
                <div class="zoom-controls">
                    <button onclick="zoomOut()">-</button>
                    <button onclick="zoomIn()">+</button>
                    <button onclick="resetZoom()">⤢</button>
                </div>
                <svg id="markmap-svg"></svg>
            </div>

            <!-- 하위 노트 개별 조회 패널 -->
            <div class="detail-view" id="detail-view">
                <div class="detail-top">
                    <div class="detail-title" id="detail-title">철학</div>
                    <button class="icon-btn" onclick="closeDetail()">✕</button>
                </div>
                <div class="detail-date" id="detail-date">2024년 7월 3일 고침</div>
                <div class="detail-body" id="detail-body">
                    세계를 어떻게 알 수 있는지, 어떻게 살아야 하는지를 묻는 가지. 여기서는 인식론과 윤리학만 짧게 열어 두었습니다.
                </div>

                <div class="sub-section-title">
                    <span>하위 노트</span>
                    <span id="sub-count">2개의 가지</span>
                </div>

                <div class="card-list" id="card-list"></div>
            </div>
        </div>
    </div>

    <!-- 텍스트 수정 모달 -->
    <div class="editor-modal" id="editor-modal">
        <div class="editor-box">
            <h3 style="color:#fff;">텍스트 편집 (마크다운)</h3>
            <textarea id="markdown-input"></textarea>
            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button style="flex:1; padding:10px; background:#333; color:#fff; border:none; border-radius:8px;" onclick="toggleEditor()">취소</button>
                <button style="flex:1; padding:10px; background:var(--btn-light); color:#000; border:none; border-radius:8px; font-weight:600;" onclick="saveEditor()">적용하기</button>
            </div>
        </div>
    </div>

    <script>
        const { Transformer, Markmap } = window.markmap;
        const transformer = new Transformer();
        let markmapInstance = null;

        const initialData = `# 지식 나무
- 실바에 오신 것을 환영합니다
  - 노트는 페이지입니다
  - 관계는 나무가 됩니다
    - 상위와 하위
    - 지식의 결
  - 지도를 펼치세요
- 탐험용 지식
  - 철학
    - 인식론
      - 선험적 지식
      - 실재론
    - 윤리학
      - 덕 윤리
      - 직관주의
  - 과학
    - 물리학
    - 생물학
  - 언어와 삶
    - 글쓰기
    - 실재`;

        let currentMarkdown = initialData;

        function init() {
            document.getElementById('markdown-input').value = currentMarkdown;
            renderAll();
        }

        function renderAll() {
            const { root } = transformer.transform(currentMarkdown);
            const svg = document.querySelector('#markmap-svg');
            svg.innerHTML = '';
            markmapInstance = Markmap.create(svg, { duration: 200, zoom: true, pan: true }, root);

            setTimeout(() => {
                d3.selectAll('.markmap-node').on('click', (e, d) => {
                    e.stopPropagation();
                    openDetail(d.data);
                });
            }, 300);

            buildSidebarTree(root);
        }

        function buildSidebarTree(rootNode) {
            const container = document.getElementById('tree-container');
            container.innerHTML = '';
            if (!rootNode.children) return;

            function traverse(nodes, level = 0) {
                nodes.forEach(node => {
                    const title = node.content.replace(/<[^>]*>?/gm, '');
                    const div = document.createElement('div');
                    div.className = `tree-item tree-indent-${level}`;
                    div.innerHTML = `<span>${level > 0 ? '˅ ' : ''}${title}</span><span>+</span>`;
                    div.onclick = () => openDetail(node);
                    container.appendChild(div);

                    if (node.children) traverse(node.children, level + 1);
                });
            }

            traverse(rootNode.children);
        }

        function openDetail(node) {
            const title = node.content.replace(/<[^>]*>?/gm, '');
            document.getElementById('detail-title').innerText = title;
            
            const children = node.children || [];
            document.getElementById('sub-count').innerText = `${children.length}개의 가지`;

            const cardList = document.getElementById('card-list');
            cardList.innerHTML = '';

            if (children.length === 0) {
                cardList.innerHTML = `<div style="color:#666; font-size:0.85rem;">하위 항목이 없습니다.</div>`;
            } else {
                children.forEach(child => {
                    const childTitle = child.content.replace(/<[^>]*>?/gm, '');
                    const grandChildren = child.children || [];
                    const desc = grandChildren.length > 0 
                        ? grandChildren.map(g => g.content.replace(/<[^>]*>?/gm, '')).join(', ') 
                        : '상세 설명 정보가 기록되어 있지 않습니다.';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-title">${childTitle}</div>
                        <div class="card-desc">${desc}</div>
                    `;
                    card.onclick = () => openDetail(child);
                    cardList.appendChild(card);
                });
            }

            document.getElementById('detail-view').classList.add('open');
        }

        function closeDetail() {
            document.getElementById('detail-view').classList.remove('open');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function toggleEditor() {
            document.getElementById('editor-modal').classList.toggle('open');
        }

        function saveEditor() {
            currentMarkdown = document.getElementById('markdown-input').value;
            renderAll();
            toggleEditor();
        }

        function addNewRoot() {
            currentMarkdown += `\n- 새 뿌리 노트`;
            document.getElementById('markdown-input').value = currentMarkdown;
            renderAll();
        }

        function zoomIn() { markmapInstance?.rescale(1.25); }
        function zoomOut() { markmapInstance?.rescale(0.8); }
        function resetZoom() { markmapInstance?.fit(); }

        window.onload = init;
    </script>
</body>
</html>
